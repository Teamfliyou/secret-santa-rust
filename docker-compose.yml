services:
  db:
    image: postgres:16-alpine
    container_name: secret-santa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: santa
    volumes:
      - santa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  secret-santa:
    build: .
    container_name: secret-santa
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://santa:${POSTGRES_PASSWORD}@db:5432/santa
      BIND_ADDR: 0.0.0.0:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposé uniquement en local : le reverse proxy (HTTPS) s'y connecte.
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  santa-pgdata:
