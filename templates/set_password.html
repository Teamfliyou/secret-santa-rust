{% extends "base.html" %}
{% block content %}
<section class="card form-card">
  <h1><span aria-hidden="true">🔐</span> Bienvenue {{ first_name }} !</h1>
  <p class="lead">C'est ta première connexion : choisis ton mot de passe personnel.</p>
  <p class="hint">Il est secret, personne d'autre ne le connaît (pas même l'organisateur). 8 caractères minimum. Retiens-le bien !</p>
  <form method="post" action="/set-password" class="form">
    <input type="hidden" name="csrf" value="{{ ctx.csrf }}">
    <label class="field"><span>Nouveau mot de passe</span><input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password" autofocus></label>
    <label class="field"><span>Confirme ton mot de passe</span><input type="password" name="confirm" required minlength="8" maxlength="128" autocomplete="new-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Enregistrer et continuer →</button>
  </form>
</section>
{% endblock %}
