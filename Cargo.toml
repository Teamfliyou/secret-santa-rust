[package]
name = "secret-santa"
version = "1.0.0"
edition = "2021"
description = "Application web de Secret Santa pour une classe"

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.12"
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
csv = "1"
dotenvy = "0.15"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

# Argon2 est très lent en profil debug : on optimise les dépendances.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
